repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: file-size
        name: file-size
        entry: python3 scripts/check-file-size.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
