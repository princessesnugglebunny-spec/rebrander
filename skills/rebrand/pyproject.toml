[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
